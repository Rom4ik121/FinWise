[product]
name = "FinWise"
org = "com.finanse.app"
description = "Personal finance tracker"
version = "0.1.0"

[app]
module = "main"

# Mirror pyproject [tool.flet.app].exclude — keep tests/docs/scripts out of APK/IPA/desktop.
[tool.flet.app]
module = "main"
exclude = [
  ".venv",
  "venv",
  ".git",
  ".github",
  ".cursor",
  ".claude",
  ".flet",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".hypothesis",
  "htmlcov",
  "__pycache__",
  "tests",
  "docs",
  "scripts",
  "agent-transcripts",
  "agent-tools",
  "build",
  "dist",
  "storage",
  "secrets",
  "AGENTS.md",
  "pytest.ini",
  "codemagic.yaml",
  "vendor/wheels",
  "vendor",
]

[tool.flet.deep_linking]
scheme = "finwise"
host = "app"

[tool.flet.dev_packages]
ccxt = "./vendor/ccxt"
flet-local-auth = "./extensions/flet_local_auth"
flet-local-notifications = "./extensions/flet_local_notifications"

[tool.flet.android.permission]
"android.permission.USE_BIOMETRIC" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.VIBRATE" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.USE_EXACT_ALARM" = true
"android.permission.WAKE_LOCK" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_MEDIA_IMAGES" = true

[tool.flet.android]
adaptive_icon_background = "#0B1220"

[flutter.pubspec.dependencies]
local_auth = "^2.3.0"
local_auth_android = "^1.0.46"
local_auth_darwin = "^1.4.1"
url_launcher = "^6.2.5"

[tool.flet.splash]
color = "#0B1220"
dark_color = "#0B1220"
icon_bgcolor = "#0B1220"
icon_dark_bgcolor = "#0B1220"

[tool.flet.ios.info]
NSFaceIDUsageDescription = "Unlock FinWise with Face ID"
