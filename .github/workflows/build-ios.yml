# GitHub-hosted macOS cannot produce a signed App Store / Ad Hoc IPA
# (no Apple Distribution cert, no matching profile, no Flet iOS patch watch).
# Use Codemagic workflows in codemagic.yaml instead:
#   ios-ipa      — Ad Hoc (device testing)
#   ios-appstore — App Store / TestFlight
#   ios-smoke    — unsigned smoke
#
# This workflow stays as a pointer so the old "Build iOS" action is not mistaken
# for a shippable artifact.

name: Build iOS

on:
  workflow_dispatch:

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Use Codemagic for IPA
        run: |
          echo "Signed IPA builds run on Codemagic (codemagic.yaml)."
          echo "Workflows: ios-ipa (Ad Hoc), ios-appstore (App Store), ios-smoke."
          echo "See docs/CODEMAGIC.md"
          exit 0
