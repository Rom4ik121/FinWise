[project]
name = "flet-local-notifications"
version = "0.1.0"
description = "Local notifications for FinWise (iOS + Android)."
requires-python = ">=3.11"
dependencies = [
  "flet>=0.83.0,<0.87",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.flet.extensions.flet_local_notifications]
path = "flutter/flet_local_notifications"

[tool.setuptools.packages.find]
where = ["."]
