# Codemagic CI — build signed IPA for Finanse (Flet).
# Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
#
# Before first build in Codemagic UI:
# 1) Connect this GitHub repo
# 2) Code signing identities → upload Distribution cert + Ad Hoc profile
#    (or link App Store Connect API key and fetch them)
# 3) Environment variables group `finanse_ios`:
#      APPLE_TEAM_ID = your 10-char Team ID
# 4) Start workflow `ios-ipa`

workflows:
  ios-ipa:
    name: FinWise iOS IPA (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - finanse_ios
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.finanse.app
      vars:
        PACKAGE_NAME: com.finanse.app
        APP_NAME: FinWise
        APP_VERSION: "0.1.0"
    scripts:
      - name: Install Python dependencies
        script: |
          set -e
          python3 -m pip install -U pip wheel
          python3 -m pip install -U "flet[all]" -r requirements.txt
          flet --version || python3 -m flet --version || true
      - name: Vendor mobile-safe ccxt
        script: |
          set -e
          # Generates vendor/ccxt (gitignored) with absolute file:// install for Flet.
          python3 scripts/vendor_ccxt_mobile.py
          test -f vendor/ccxt/pyproject.toml
      - name: Set up code signing keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Build IPA with Flet
        script: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_TEAM_ID is missing. Add it to Codemagic group finanse_ios."
            exit 1
          fi

          python3 scripts/flet_build_with_ios_patch.py --timeout 7200 -- \
          flet build ipa \
            --org com.finanse.app \
            --product "$APP_NAME" \
            --build-version "$APP_VERSION" \
            --build-number "${PROJECT_BUILD_NUMBER:-1}" \
            --ios-team-id "$APPLE_TEAM_ID" \
            --ios-export-method release-testing \
            --ios-signing-certificate "Apple Distribution" \
            --splash-color "#0B1220" \
            --splash-dark-color "#0B1220" \
            --exclude build --exclude dist --exclude storage --exclude secrets \
            --exclude .venv --exclude venv --exclude .git --exclude .github \
            --exclude .cursor --exclude .claude --exclude .flet \
            --exclude .pytest_cache --exclude .mypy_cache --exclude .ruff_cache \
            --exclude .tox --exclude .hypothesis --exclude htmlcov \
            --exclude __pycache__ --exclude tests --exclude docs --exclude scripts \
            --exclude vendor --exclude agent-transcripts --exclude agent-tools \
            --exclude AGENTS.md --exclude pytest.ini --exclude codemagic.yaml \
            --yes \
            --no-rich-output \
            --verbose
      - name: Locate IPA
        script: |
          echo "Searching for IPA artifacts..."
          find build -name "*.ipa" -print || true
          ls -la build/ipa 2>/dev/null || true
    artifacts:
      - build/ipa/*.ipa
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Email notifications: enable in Codemagic UI (Settings → Notifications)
    # or add a real address here, e.g. rpavlenko995@gmail.com

  # Unsigned / smoke path — useful to verify Flet builds before signing is ready.
  ios-smoke:
    name: FinWise iOS smoke (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Python dependencies
        script: |
          python3 -m pip install -U pip wheel
          python3 -m pip install -U "flet[all]" -r requirements.txt
      - name: Vendor mobile-safe ccxt
        script: |
          set -e
          python3 scripts/vendor_ccxt_mobile.py
          test -f vendor/ccxt/pyproject.toml
      - name: Build iOS project (may still need signing for IPA export)
        script: |
          set -euo pipefail
          # If this fails on binary wheels, fix deps before spending signed-build minutes.
          # Always watch+patch+verify AppDelegate willPresent (same as signed IPA workflows).
          EXCLUDES="--exclude build --exclude dist --exclude storage --exclude secrets --exclude .venv --exclude venv --exclude .git --exclude .github --exclude .cursor --exclude .claude --exclude .flet --exclude .pytest_cache --exclude .mypy_cache --exclude .ruff_cache --exclude .tox --exclude .hypothesis --exclude htmlcov --exclude __pycache__ --exclude tests --exclude docs --exclude scripts --exclude vendor --exclude agent-transcripts --exclude agent-tools --exclude AGENTS.md --exclude pytest.ini --exclude codemagic.yaml"
          python3 scripts/flet_build_with_ios_patch.py --timeout 7200 -- bash -lc \
            "flet build ipa --org com.finanse.app --product FinWise --splash-color '#0B1220' --splash-dark-color '#0B1220' $EXCLUDES --yes --no-rich-output --verbose || flet build ios-simulator --org com.finanse.app --product FinWise --splash-color '#0B1220' --splash-dark-color '#0B1220' $EXCLUDES --yes --no-rich-output --verbose"
    artifacts:
      - build/**/*.ipa
      - build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # App Store / TestFlight — requires App Store provisioning + App Store Connect.
  # Codemagic UI: Code signing identities → App Store profile for com.finanse.app
  # (or App Store Connect API key). Same finanse_ios group as ios-ipa.
  ios-appstore:
    name: FinWise iOS IPA (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - finanse_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.finanse.app
      vars:
        PACKAGE_NAME: com.finanse.app
        APP_NAME: FinWise
        APP_VERSION: "0.1.0"
    scripts:
      - name: Install Python dependencies
        script: |
          set -e
          python3 -m pip install -U pip wheel
          python3 -m pip install -U "flet[all]" -r requirements.txt
          flet --version || python3 -m flet --version || true
      - name: Vendor mobile-safe ccxt
        script: |
          set -e
          python3 scripts/vendor_ccxt_mobile.py
          test -f vendor/ccxt/pyproject.toml
      - name: Set up code signing keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Build App Store IPA with Flet
        script: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_TEAM_ID is missing. Add it to Codemagic group finanse_ios."
            exit 1
          fi

          python3 scripts/flet_build_with_ios_patch.py --timeout 7200 -- \
          flet build ipa \
            --org com.finanse.app \
            --product "$APP_NAME" \
            --build-version "$APP_VERSION" \
            --build-number "${PROJECT_BUILD_NUMBER:-1}" \
            --ios-team-id "$APPLE_TEAM_ID" \
            --ios-export-method app-store \
            --ios-signing-certificate "Apple Distribution" \
            --splash-color "#0B1220" \
            --splash-dark-color "#0B1220" \
            --exclude build --exclude dist --exclude storage --exclude secrets \
            --exclude .venv --exclude venv --exclude .git --exclude .github \
            --exclude .cursor --exclude .claude --exclude .flet \
            --exclude .pytest_cache --exclude .mypy_cache --exclude .ruff_cache \
            --exclude .tox --exclude .hypothesis --exclude htmlcov \
            --exclude __pycache__ --exclude tests --exclude docs --exclude scripts \
            --exclude vendor --exclude agent-transcripts --exclude agent-tools \
            --exclude AGENTS.md --exclude pytest.ini --exclude codemagic.yaml \
            --yes \
            --no-rich-output \
            --verbose
      - name: Locate IPA
        script: |
          echo "Searching for IPA artifacts..."
          find build -name "*.ipa" -print || true
          ls -la build/ipa 2>/dev/null || true
    artifacts:
      - build/ipa/*.ipa
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log

