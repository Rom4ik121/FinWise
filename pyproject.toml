# Finanse — packaging / project metadata for Flet builds.
# IPA can only be produced on macOS with Xcode + Apple Developer signing.

[project]
name = "finanse"
version = "0.1.0"
description = "Personal finance tracker"
requires-python = ">=3.11"
dependencies = [
  "flet>=0.83.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
  "matplotlib>=3.9.0",
  "reportlab>=4.2.0",
  "python-dateutil>=2.9.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "platformdirs>=4.0.0",
  "alembic>=1.14.0",
  "flet-local-auth",
  "flet-local-notifications",
  "flet-speech",
  "flet-android-notifications>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
windows = [
  "winrt-runtime>=3.0.0",
  "winrt-Windows.Foundation>=3.0.0",
  "winrt-Windows.Security.Credentials.UI>=3.0.0",
  "winotify>=1.1.0",
]

[tool.flet]
org = "com.finanse.app"
product = "FinWise"
description = "Personal finance tracker"

[tool.flet.app]
module = "main"

[tool.flet.deep_linking]
scheme = "finwise"
host = "voice"

[tool.flet.dev_packages]
flet-local-auth = "./extensions/flet_local_auth"
flet-local-notifications = "./extensions/flet_local_notifications"
flet-speech = "./extensions/flet_speech"

[tool.flet.android.permission]
"android.permission.USE_BIOMETRIC" = true
"android.permission.USE_FINGERPRINT" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.VIBRATE" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.USE_EXACT_ALARM" = true
"android.permission.WAKE_LOCK" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_MEDIA_IMAGES" = true

[tool.flet.flutter.pubspec.dependencies]
local_auth = "^2.3.0"
local_auth_android = "^1.0.46"
local_auth_darwin = "^1.4.1"
flutter_local_notifications = "^17.2.4"
timezone = "^0.9.4"
speech_to_text = "^6.6.2"

[tool.flet.splash]
color = "#000000"
dark_color = "#000000"
icon_bgcolor = "#000000"
icon_dark_bgcolor = "#000000"

# Fill team_id after joining Apple Developer Program (Membership → Team ID).
# Ad Hoc / development profiles must include your iPhone 12 UDID.
[tool.flet.ios]
# team_id = "YOUR10CHAR"
# export_method = "release-testing"
# signing_certificate = "Apple Distribution"
# provisioning_profile = "Finanse Ad Hoc"

[tool.flet.ios.info]
NSFaceIDUsageDescription = "Unlock FinWise with Face ID"
NSMicrophoneUsageDescription = "Record a spoken expense or income"
NSSpeechRecognitionUsageDescription = "Turn speech into an expense or income"
